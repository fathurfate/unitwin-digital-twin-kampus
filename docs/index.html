<style>
:root{--navy:#0B1630;--navy2:#16254A;--gold:#B8902F;--gl:#E8D9AE;--ivory:#FAF7F0;--line:#E4DCC8;--tx:#1F2A44;--mu:#6B7385;--ok:#2E8B6E;--off:#9AA3B6;--bad:#C8485E;--am:#D9A441;--use:#1F8FB8}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',system-ui,Arial,sans-serif;color:var(--tx);background:var(--ivory);display:flex;min-height:100vh;font-size:13px}
aside{width:228px;background:var(--navy);color:#DDE4F2;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none}
.logo{font-size:23px;font-weight:700;color:#fff;letter-spacing:.3px;padding:0 8px}.logo b{color:var(--gl)}
.sub{font-size:10.5px;color:#9FB0D0;padding:2px 8px 18px;line-height:1.4}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#C9D3E8;font:500 13px Poppins,system-ui;padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:3px}
nav button:hover{background:var(--navy2)}nav button.on{background:var(--gold);color:#fff}
.ctl{margin-top:auto;background:var(--navy2);border-radius:12px;padding:12px;font-size:11px}
.ctl .t{font-size:20px;font-weight:700;color:#fff}.ctl input{width:100%;accent-color:var(--gold);margin:8px 0}
.ctl button{background:var(--gold);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:600 11px Poppins;cursor:pointer}
.demo{font-size:10px;color:#9FB0D0;margin-top:8px;line-height:1.4}
main{flex:1;padding:22px 28px;min-width:0}
h1{font-size:20px;margin:0}.lead{color:var(--mu);margin:2px 0 16px;font-size:12px}
.row{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.kpi .v{font-size:27px;font-weight:700;color:var(--navy);line-height:1.2}.kpi .l{font-size:11px;color:var(--mu)}.kpi.warn .v{color:var(--bad)}
.two{display:grid;grid-template-columns:1.8fr 1fr;gap:14px;margin-top:14px}.two.r{grid-template-columns:1fr 1.7fr}
@media(max-width:1100px){.two,.two.r{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap}
.ON,.ONLINE,.s-ok{background:var(--ok)}.OFF,.s-off{background:var(--off)}.RUSAK,.OFFLINE,.s-bad,.Tinggi{background:var(--bad)}.Sedang{background:var(--am)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button,select{font:500 12px Poppins,system-ui;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;cursor:pointer;color:var(--tx)}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid #EFEAD9;vertical-align:top}tr:hover td{background:#FDFBF5}
a.lnk{color:var(--gold);font-weight:600;cursor:pointer;text-decoration:none}
.al{padding:9px 10px;border-left:3px solid var(--bad);background:#FBF2F4;border-radius:6px;margin-bottom:8px;font-size:12px}.al.w{border-color:var(--am);background:#FCF6E8}.al.g{border-color:var(--use);background:#EDF6FA}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--mu);margin-top:8px}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:600 12px Poppins;cursor:pointer}
.bld{cursor:pointer}.rm{cursor:pointer}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}.flow div{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:10px;font-size:11.5px}
.flow b{display:block;margin-bottom:3px;color:var(--navy)}
.new{display:inline-block;background:var(--gl);color:var(--navy);font-size:9px;font-weight:700;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:1px}nav button.on .new{background:#fff}
#w3slot{position:relative;height:clamp(460px,72vh,700px);border-radius:10px;overflow:hidden;background:#CFE6F5}
#w3{position:absolute;inset:0}#w3 canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.w3o{position:absolute;left:10px;top:10px;background:rgba(11,22,48,.8);color:#fff;border-radius:8px;padding:5px 11px;font-size:11px;font-weight:500;pointer-events:none}.w3o.r{left:auto;right:10px}
.w3o.hint{top:auto;bottom:10px;background:rgba(255,255,255,.82);color:var(--mu);font-size:10.5px}
#w3tip{position:absolute;display:none;pointer-events:none;background:rgba(11,22,48,.93);color:#fff;padding:8px 11px;border-radius:8px;font-size:11px;line-height:1.55;max-width:240px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}.side .card h3{margin-bottom:6px}
.scx{overflow-x:auto;-webkit-overflow-scrolling:touch}.swipe{display:none;font-size:10.5px;color:var(--mu);margin-top:4px}.w3o.hint .m{display:none}
@media(max-width:768px){
body{flex-direction:column}
aside{display:contents}
.logo{background:var(--navy);padding:calc(12px + env(safe-area-inset-top)) 16px 2px;font-size:20px}
.sub{display:none}
nav{position:sticky;top:0;z-index:30;display:flex;gap:6px;overflow-x:auto;background:var(--navy);padding:8px 12px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{width:auto;flex:none;white-space:nowrap;margin:0;padding:9px 14px;border-radius:18px;font-size:12.5px;background:var(--navy2)}
nav button.on{background:var(--gold)}
.ctl{margin:0;border-radius:0;display:flex;align-items:center;gap:10px;padding:8px 16px}
.ctl>div:first-child,.demo{display:none}
.ctl .t{font-size:17px;min-width:52px}.ctl input{flex:1;margin:0}
main{padding:14px 12px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:18px}.lead{font-size:12px}
.k4{grid-template-columns:repeat(2,1fr);gap:10px}.k4>:last-child:nth-child(odd){grid-column:span 2}
.kpi .v{font-size:22px}
.card{padding:12px;overflow-x:auto}
.two,.two.r{gap:12px}
svg.w1{min-width:860px}svg.w2{min-width:760px}.swipe{display:block}
.wt{min-width:600px}
.chips button,select{padding:8px 14px;font-size:12.5px}select{font-size:16px}
#w3slot{height:62vh;min-height:380px;max-height:560px}
.w3o{font-size:10px;padding:4px 9px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.w3o.r{display:none}
.w3o.hint .d{display:none}.w3o.hint .m{display:inline}.w3o.hint{white-space:normal}
.side .dt.has{order:-1}
.leg{gap:6px 12px}
}
</style>
</head>
<body>
<aside>
  <div class="logo">Uni<b>Twin</b></div>
  <div class="sub">Integrasi IoT kampus<br>UPN "Veteran" Jakarta, Kampus Pondok Labu</div>
  <nav id="nav"></nav>
  <div class="ctl"><div>Jam simulasi</div><div class="t" id="clk">10:20</div><input type="range" id="sl" min="360" max="1200" step="10" value="620"><button id="pl">Putar</button>
    <div class="demo">Mode demo: data simulasi. Sambungkan ke CCTV, AC, dan TV kampus lewat gateway UniTwin untuk data nyata.</div></div>
</aside>
<main id="m"></main>
<script>
/* ===== Model kampus (ilustratif, bukan denah resmi) ===== */
/* Nama gedung = sumber resmi UPNVJ (pengumuman UTBK 2026, laman FH dan FK). Pembagian fakultas (kecuali FH), posisi peta, dan ruang per lantai = ASUMSI, ubah di sini.
   Kolom: kode, nama gedung, mata kuliah, x peta, y peta, ruang kelas per lantai, fakultas, fakultas terverifikasi?, lebar di peta, singkatan */
const MKU=['Pendidikan Pancasila','Bahasa Indonesia','Bela Negara','Kewarganegaraan','Bahasa Inggris'];
const FAC=[['KHD','Gedung Ki Hajar Dewantara',MKU,30,70,[3,3,3,3],'Kuliah bersama (mata kuliah umum)',false,230,'MKU'],
['SOE','Gedung Dr. Soetomo',['Basis Data','Sistem Operasi','Jaringan Komputer','Transformasi Digital','Pemrograman Web','Kecerdasan Buatan'],280,70,[3,3,3,3],'Fakultas Ilmu Komputer',false,230,'FIK'],
['CMK','Gedung Dr. Cipto Mangunkusumo',['Anatomi','Fisiologi','Biokimia','Histologi'],530,70,[3,3,3,3],'Fakultas Kedokteran',false,230,'FK'],
['RAK','Gedung RA Kartini',['Metodologi Penelitian Hukum','Seminar Hukum','Hukum Kesehatan'],780,70,[2,1],'Hukum Pascasarjana (S2 dan S3)',true,190,'FH S2/S3'],
['MHT','Gedung Moh. Husni Thamrin',['Akuntansi Biaya','Manajemen Keuangan','Ekonomi Makro','Pemasaran','Perpajakan'],30,330,[3,3,3,3],'Fakultas Ekonomi dan Bisnis',false,230,'FEB'],
['MYM','Gedung Mr. Moh. Yamin',['Teori Politik','Komunikasi Massa','Sosiologi','Hubungan Internasional'],280,330,[2,2,2,2],'Fakultas Ilmu Sosial dan Ilmu Politik',false,230,'FISIP'],
['YOS','Gedung Yos Sudarso',['Hukum Pidana','Hukum Perdata','Hukum Tata Negara','Hukum Bisnis'],530,330,[3,3,3,3],'Fakultas Hukum',true,230,'FH']];
const BM={};FAC.forEach(F=>BM[F[0]]=F);const NF=c=>BM[c][5].length;
const ERR=['E4 sensor suhu','E1 kompresor','F3 tekanan refrigeran','E7 komunikasi unit'],TARIF=1444.7,KW=1.8;
const h32=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const RN=s=>{let t=(h32(String(s))+0x6D2B79F5)>>>0;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const RS=[];FAC.forEach(F=>F[5].forEach((n,fi)=>{const f=fi+1;for(let k=1;k<=n;k++){const id=F[0]+'-'+f+'0'+k;RS.push({id,fac:F[0],fn:F[1]+' ('+F[9]+')',f,k,type:'Kelas',cap:40,cs:F[2],acBad:RN(id+'ac')<.06,tvBad:RN(id+'tv')<.05,ccOff:RN(id+'cc')<.02})}}));
let T=620,tick=0,S={},V='peta',B='SOE',FL=3,SEL=null,play=null,fT='all',fS='bad',fB='all';const TK={};
function st(r){const blk=Math.floor(T/60),tb=Math.floor(T/20);
 const sched=(T>=450&&T<=1020&&RN(r.id+'s'+blk)<(r.f===1?.66:.5))?r.cs[Math.floor(RN(r.id+'c'+blk)*r.cs.length)]:null;
 let p=0;if(sched)p=Math.round(r.cap*(.45+.5*RN(r.id+'p'+tb+tick)));else if(RN(r.id+'g'+tb)<.06)p=1+Math.floor(RN(r.id+'n'+tb)*4);
 if(sched&&RN(r.id+'o'+tb)<.04)p=Math.round(r.cap*1.18);
 const ac=r.acBad?'RUSAK':(sched||RN(r.id+'a'+tb)<.12)?'ON':'OFF',tv=r.tvBad?'RUSAK':((sched&&RN(r.id+'t'+blk)<.7)||RN(r.id+'x'+tb)<.04)?'ON':'OFF',cc=r.ccOff?'OFFLINE':'ONLINE';
 let an=null;if(cc==='ONLINE'){if(p>r.cap)an='Kerumunan melebihi kapasitas';else if(!sched&&p>=3)an='Aktivitas di luar jadwal';else if(RN(r.id+'m'+tb)<.012)an='Gerakan tidak wajar'}
 return{sched,p:cc==='OFFLINE'?null:p,ac,tv,cc,an,waste:ac==='ON'&&p===0,err:ac==='RUSAK'?ERR[Math.floor(RN(r.id+'e')*4)]:null,bad:(ac==='RUSAK')+(tv==='RUSAK')+(cc==='OFFLINE')}}
function calc(){RS.forEach(r=>S[r.id]=st(r))}
function agg(){const A={p:0,cap:0,used:0,bad:0,an:0,waste:0,b:{}};FAC.forEach(F=>A.b[F[0]]={p:0,cap:0,used:0,bad:0,an:0,waste:0});
 RS.forEach(r=>{const s=S[r.id],x=A.b[r.fac];[A,x].forEach(o=>{o.p+=s.p||0;o.cap+=r.cap;o.used+=(s.p>0||s.sched)?1:0;o.bad+=s.bad;o.an+=s.an?1:0;o.waste+=s.waste?1:0})});return A}
const mix=(a,b,q)=>{q=Math.max(0,Math.min(1,q));const c=i=>Math.round(parseInt(a.substr(i,2),16)*(1-q)+parseInt(b.substr(i,2),16)*q);return'rgb('+c(1)+','+c(3)+','+c(5)+')'};
const occ=q=>mix('#EDF3F6','#1F8FB8',q),hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),idr=n=>'Rp'+new Intl.NumberFormat('id-ID').format(Math.round(n));
const pill=(t,c)=>'<span class="pill '+(c||t)+'">'+t+'</span>';
/* ===== Tampilan ===== */
const NAV=[['peta','Peta Kampus'],['3d','Tampilan 3D <span class="new">Baru</span>'],['denah','Denah Gedung'],['perangkat','Perangkat dan Kerusakan'],['anomali','Anomali CCTV'],['integrasi','Integrasi Sistem']];
function go(v,b,f){V=v;if(b)B=b;if(f)FL=+f;SEL=null;try{location.hash=v+(v==='denah'?'/'+B+'/'+FL:'')}catch(e){}render()}
function sel(id){SEL=id;render(true)}
function head(t,l){return'<h1>'+t+'</h1><div class="lead">'+l+'</div>'}
function kpi(a){const w=a.waste*KW;return'<div class="row k4"><div class="card kpi"><h3>Orang di kampus</h3><div class="v">'+a.p+'</div><div class="l">hasil hitung CCTV, kapasitas '+a.cap+'</div></div>'+
 '<div class="card kpi"><h3>Ruang terpakai</h3><div class="v">'+a.used+' / '+RS.length+'</div><div class="l">terjadwal atau ada orang</div></div>'+
 '<div class="card kpi warn"><h3>Perangkat bermasalah</h3><div class="v">'+a.bad+'</div><div class="l">AC rusak, TV rusak, CCTV offline</div></div>'+
 '<div class="card kpi warn"><h3>Anomali aktif</h3><div class="v">'+a.an+'</div><div class="l">dari analitik CCTV</div></div>'+
 '<div class="card kpi"><h3>AC boros</h3><div class="v">'+a.waste+'</div><div class="l">menyala di ruang kosong, '+w.toFixed(1)+' kW, '+idr(w*TARIF)+'/jam</div></div></div>'}
function campus(a){const pb=(x,y,w,h,L)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="#C9CEDA" stroke="#9AA3B6"/>'+L.map((t,i)=>'<text x="'+(x+w/2)+'" y="'+(y+h/2+4+(i-(L.length-1)/2)*14)+'" text-anchor="middle" font-size="11.5" fill="#4A5570">'+t+'</text>').join('');
 let g='<rect width="1000" height="560" rx="14" fill="#EEF3EA"/><rect x="20" y="205" width="960" height="115" fill="#DDE3DC"/><rect x="20" y="215" width="960" height="95" fill="#EEF3EA"/>'+
 pb(60,225,140,70,['Perpustakaan Pusat','(3 lantai)'])+pb(300,235,100,50,['KanBers'])+pb(440,225,120,70,['Rektorat'])+pb(620,225,150,70,['Auditorium','Bhinneka Tunggal Ika'])+
 '<rect x="800" y="335" width="170" height="105" rx="8" fill="#CFE0EC" stroke="#9AA3B6"/><text x="885" y="392" text-anchor="middle" font-size="12" fill="#4A5570">Lapangan olahraga</text>'+
 '<rect x="20" y="470" width="960" height="75" rx="8" fill="#D6D9E0"/><text x="60" y="515" font-size="12" fill="#4A5570">Area parkir</text><rect x="400" y="451" width="200" height="22" fill="#0B1630"/><text x="500" y="466" text-anchor="middle" font-size="11" fill="#fff">Gerbang Jl. RS Fatmawati</text>';
 FAC.forEach(F=>{const x=F[3],y=F[4],w=F[8],s=a.b[F[0]],q=s.p/s.cap,an=s.an>=2,cx=x+w/2,nf=F[5].length;
  g+='<g class="bld" onclick="go(\'denah\',\''+F[0]+'\','+Math.min(3,nf)+')"><rect x="'+(x+5)+'" y="'+(y+6)+'" width="'+w+'" height="118" rx="8" fill="#0B1630" opacity=".13"/><rect x="'+x+'" y="'+y+'" width="'+w+'" height="118" rx="8" fill="'+occ(q*1.5)+'" stroke="'+(an?'#C8485E':'#0B1630')+'" stroke-width="'+(an?4:2)+'"/><rect x="'+(x+14)+'" y="'+(y+14)+'" width="'+(w-28)+'" height="90" rx="4" fill="none" stroke="#0B1630" stroke-opacity=".25" stroke-dasharray="5 4"/>'+
  '<text x="'+cx+'" y="'+(y+40)+'" text-anchor="middle" font-size="'+(F[1].length>26?12.5:14)+'" font-weight="700" fill="#0B1630">'+F[1]+'</text><text x="'+cx+'" y="'+(y+57)+'" text-anchor="middle" font-size="10" fill="#0B1630">'+F[9]+(F[7]?'':' (asumsi)')+' | '+nf+' lantai</text>'+
  '<text x="'+cx+'" y="'+(y+84)+'" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1630">'+s.p+' / '+s.cap+' orang</text>'+
  (s.bad?'<rect x="'+(x+8)+'" y="'+(y+98)+'" width="58" height="17" rx="8" fill="#C8485E"/><text x="'+(x+37)+'" y="'+(y+110)+'" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">'+s.bad+' rusak</text>':'')+
  (an?'<rect x="'+(x+w-66)+'" y="'+(y+98)+'" width="58" height="17" rx="8" fill="#D9A441"/><text x="'+(x+w-37)+'" y="'+(y+110)+'" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">'+s.an+' anomali</text>':'')+'</g>'});
 return'<div class="scx"><svg class="w1" viewBox="0 0 1000 560" font-family="Poppins,system-ui">'+g+'</svg></div><div class="swipe">Geser ke samping untuk melihat seluruh peta</div><div class="leg"><span>Warna gedung = tingkat keterisian</span><span><i style="background:'+occ(0)+'"></i>sepi</span><span><i style="background:'+occ(1)+'"></i>padat</span><span>Nama gedung dari sumber resmi UPNVJ; posisi dan pembagian fakultas (asumsi) ilustratif</span></div>'}
function alerts(){const L=[],L2=(r)=>'<a class="lnk" onclick="go(\'denah\',\''+r.fac+'\','+r.f+');sel(\''+r.id+'\')">denah</a>';RS.forEach(r=>{const s=S[r.id];if(s.an)L.push([0,'<div class="al"><b>'+r.id+'</b> '+s.an+(s.p!=null?' ('+s.p+' orang)':'')+' '+L2(r)+'</div>']);
 if(s.ac==='RUSAK'&&s.sched)L.push([1,'<div class="al w"><b>'+r.id+'</b> kelas aktif, AC rusak ('+s.err+') '+L2(r)+'</div>']);
 if(s.waste)L.push([2,'<div class="al g"><b>'+r.id+'</b> AC menyala, ruang kosong '+L2(r)+'</div>'])});
 L.sort((a,b)=>a[0]-b[0]);return L.slice(0,7).map(x=>x[1]).join('')||'<div class="lead">Tidak ada peringatan.</div>'}
